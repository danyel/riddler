swagger:
  root: http://localhost:8080
riddler:
  server: http://localhost:31373
application:
  auth:
    secret: Mke7DcQEFTfDK1Vi7FVWAlDm3ei5MvEZmLA1nnTfJMM=
spring:
  application:
    version: @project.version@
    name: riddler-api
vaadin:
  devmode:
    devTools:
      enabled: false
management:
  health:
    status:
      http-mapping:
        UP: 207
  endpoints:
    web:
      exposure:
        include: "refresh,health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        custom:
          include: diskSpace,ping
          show-components: always
      show-details: always
  tracing:
    sampling:
      probability: 1.0
